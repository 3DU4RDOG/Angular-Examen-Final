<h1>CONTÁCTENOS</h1>
<form action="nombre del cliente">
    <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" class="form-control" id="nombre" name="nombre">
    </div>
    <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" class="form-control" id="email" name="email">
    </div>
    <div class="form-group">
        <label for="fechaDeEntrega">Fecha de Salida:</label>
        <input type="date" class="form-control" id="fechaDeEntrega" name="fechaDeEntrega">
    </div>
        <div class="form-group">
        <label for="archivo">Adjuntar documentos:</label>
        <input type="file" class="form-control-file" id="archivo" name="archivo">
    </div>
    <div class="form-group">
        <label for="ciudad">Ciudad De Destino</label>
        <select class="ciudad" id="ciudad" name="ciudad">
            <option value="ciudad">Cusco</option>
            <option value="ciudad">Lima-Arequipa</option>
        </select>
    </div>
    <div class="form-group">
        <label for="atractivo">Principales Atractivos:</label>
        <select class="form-control" id="Atractivo" name="Atractivo">
            <option value="Atractivo1">Macchu Picchu</option>
            <option value="Atractivo2">Costa Verde</option>
        </select>
    </div>
        <div class="form-group">
        <label for="comentarios">Comentarios:</label>
        <input type="text" class="form-control" id="comentarios" name="comentarios">
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-primary">Enviar</button>
    </div>
    <div class="form-group">
        <button type="reset" class="btn btn-secondary">Cancelar</button>
    </div>
</form>
